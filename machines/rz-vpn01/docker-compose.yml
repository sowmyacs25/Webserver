# VulnCorp — Machine 5: rz-vpn01
# DEPLOY: git clone <repo> && cd rz-vpn01 && sudo ./deploy.sh
# ACCESS: http://<VM_IP>:8443  (admin/admin — default creds)
# ⚠️  FOR EDUCATIONAL / LAB USE ONLY
services:
  rz-vpn01:
    build: .
    container_name: vulncorp-vpn01
    hostname: vulncorp-vpn01
    ports:
      - "0.0.0.0:2222:22"
      - "0.0.0.0:8443:8443"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    environment:
      - VULNCORP_ENV=lab
      - MACHINE_IP=172.16.0.20
